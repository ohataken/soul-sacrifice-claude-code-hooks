name: cargo-build-release-macos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release (aarch64)
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package (aarch64)
        run: tar -czf soul-sacrifice-claude-code-hooks-aarch64-apple-darwin.tar.gz -C target/aarch64-apple-darwin/release soul-sacrifice-claude-code-hooks

      - name: SHA256 (aarch64)
        run: shasum -a 256 soul-sacrifice-claude-code-hooks-aarch64-apple-darwin.tar.gz

      - name: Upload artifact (aarch64)
        uses: actions/upload-artifact@v6
        with:
          name: soul-sacrifice-claude-code-hooks-aarch64-apple-darwin
          path: soul-sacrifice-claude-code-hooks-aarch64-apple-darwin.tar.gz
